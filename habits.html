<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habits — Shaheen</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    /* ══════════════════════════════════
       VARIABLES
    ══════════════════════════════════ */
    :root {
      --bg:        #f5f2eb;
      --surface:   #faf8f3;
      --surf2:     #ede9e0;
      --border:    #d8d1c6;
      --text:      #1f1b17;
      --muted:     #7a7269;
      --teal:      #0e6a67;
      --teal-08:   rgba(14, 106, 103, 0.08);
      --teal-18:   rgba(14, 106, 103, 0.18);
      --teal-45:   rgba(14, 106, 103, 0.45);
      --red:       #b53028;
    }

    [data-theme="dark"] {
      --bg:        #161412;
      --surface:   #1d1a17;
      --surf2:     #252118;
      --border:    #302c27;
      --text:      #ece7de;
      --muted:     #8c857c;
      --teal:      #69aca8;
      --teal-08:   rgba(105, 172, 168, 0.09);
      --teal-18:   rgba(105, 172, 168, 0.18);
      --teal-45:   rgba(105, 172, 168, 0.44);
      --red:       #d95f55;
    }

    /* ══════════════════════════════════
       RESET
    ══════════════════════════════════ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ══════════════════════════════════
       LOCK SCREEN
    ══════════════════════════════════ */
    #lock {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .lock-box {
      width: 100%;
      max-width: 310px;
      text-align: center;
    }

    .lock-emoji {
      font-size: 3rem;
      display: block;
      margin-bottom: 1.4rem;
    }

    .lock-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 2.2rem;
      color: var(--text);
      margin-bottom: 0.25rem;
    }

    .lock-hint {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 2.25rem;
    }

    .lock-input {
      width: 100%;
      padding: 0.85rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      text-align: center;
      letter-spacing: 0.14em;
      outline: none;
      margin-bottom: 0.7rem;
      transition: border-color 0.18s;
    }

    .lock-input:focus {
      border-color: var(--teal);
    }

    .lock-btn {
      width: 100%;
      padding: 0.85rem;
      background: var(--teal);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 0.92rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .lock-btn:active { opacity: 0.82; }

    .lock-err {
      margin-top: 0.6rem;
      font-size: 0.78rem;
      color: var(--red);
      min-height: 1.1em;
    }

    /* ══════════════════════════════════
       APP SHELL
    ══════════════════════════════════ */
    #app { display: none; }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.5rem;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(245, 242, 235, 0.82);
      border-bottom: 1px solid var(--border);
    }

    [data-theme="dark"] .app-header {
      background: rgba(22, 20, 18, 0.85);
    }

    .header-brand {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      color: var(--text);
    }

    .header-right {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .h-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      transition: color 0.15s, border-color 0.15s;
    }

    .h-btn.lock-btn-sm:hover {
      color: var(--red);
      border-color: var(--red);
    }

    /* ══════════════════════════════════
       MAIN CONTENT
    ══════════════════════════════════ */
    main {
      max-width: 620px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 5rem;
    }

    /* ── Greeting ── */
    .greeting {
      margin-bottom: 2rem;
    }

    .greeting-line {
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      margin-bottom: 0.2rem;
    }

    .greeting-date {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.9rem;
      line-height: 1.2;
      color: var(--text);
    }

    /* ── Today progress ── */
    .prog-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.1rem 1.3rem;
      margin-bottom: 1.75rem;
    }

    .prog-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.65rem;
    }

    .prog-label {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .prog-frac {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text);
    }

    .prog-frac b {
      color: var(--teal);
      font-weight: 500;
    }

    .track {
      height: 4px;
      background: var(--surf2);
      border-radius: 99px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      background: var(--teal);
      border-radius: 99px;
      transition: width 0.45s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .done-msg {
      margin-top: 0.55rem;
      font-size: 0.76rem;
      color: var(--teal);
      display: none;
    }

    /* ── Month navigator ── */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .month-nav-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      cursor: pointer;
      color: var(--text);
      transition: border-color 0.15s, color 0.15s;
    }

    .month-nav-btn:hover {
      border-color: var(--teal);
      color: var(--teal);
    }

    .month-nav-label {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      min-width: 145px;
      text-align: center;
    }

    /* ══════════════════════════════════
       HABIT CARDS
    ══════════════════════════════════ */
    .habit-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 1rem;
    }

    .habit-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      transition: border-color 0.25s;
    }

    .habit-card.checked {
      border-color: var(--teal-18);
    }

    /* ── Card top row ── */
    .card-top {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 1rem 1.1rem;
      border-bottom: 1px solid var(--border);
    }

    .habit-card.checked .card-top {
      border-bottom-color: var(--teal-18);
    }

    /* Circle check button — marks today */
    .check-btn {
      width: 42px;
      height: 42px;
      min-width: 42px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: transparent;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .check-btn:hover:not(.done) {
      border-color: var(--teal);
      background: var(--teal-08);
    }

    .check-btn.done {
      background: var(--teal);
      border-color: var(--teal);
      color: white;
    }

    .habit-name {
      flex: 1;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Streak display */
    .streak-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 44px;
    }

    .streak-num {
      font-family: 'Playfair Display', serif;
      font-size: 1.7rem;
      font-weight: 600;
      line-height: 1;
      color: var(--teal);
    }

    .streak-num.zero {
      color: var(--muted);
      font-size: 1.2rem;
    }

    .streak-unit {
      font-size: 0.62rem;
      color: var(--muted);
      margin-top: 2px;
      letter-spacing: 0.04em;
    }

    /* Delete button */
    .del-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      opacity: 0.3;
      padding: 6px;
      font-size: 0.8rem;
      line-height: 1;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s, color 0.15s;
    }

    .del-btn:hover {
      opacity: 1;
      color: var(--red);
    }

    /* ══════════════════════════════════
       CALENDAR GRID
    ══════════════════════════════════ */
    .cal-wrap {
      padding: 1rem 1.1rem 1.2rem;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    /* Day-of-week headers */
    .cal-hdr {
      font-size: 0.68rem;
      color: var(--muted);
      text-align: center;
      padding: 2px 0 6px;
      font-weight: 400;
      letter-spacing: 0.03em;
    }

    /* Day cells */
    .cal-cell {
      aspect-ratio: 1;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, color 0.15s;
    }

    /* Hoverable past/today cells */
    .cal-cell:not(.empty):not(.future):hover {
      background: var(--teal-08);
      color: var(--teal);
    }

    /* Non-interactive */
    .cal-cell.empty {
      cursor: default;
    }

    .cal-cell.future {
      color: var(--border);
      cursor: default;
    }

    /* Today ring (not yet done) */
    .cal-cell.today {
      font-weight: 500;
      color: var(--teal);
      box-shadow: inset 0 0 0 1.5px var(--teal);
    }

    /* Done — teal fill with ✕ */
    .cal-cell.done {
      background: var(--teal);
      color: #fff;
      font-size: 0.82rem;
      font-weight: 600;
    }

    /* Done + today — extra ring outside */
    .cal-cell.done.today {
      box-shadow:
        0 0 0 2px var(--bg),
        0 0 0 4px var(--teal);
    }

    /* ══════════════════════════════════
       ADD HABIT ROW
    ══════════════════════════════════ */
    .add-row {
      border: 1px dashed var(--border);
      border-radius: 14px;
      padding: 0.85rem 1.1rem;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: border-color 0.18s;
    }

    .add-row:focus-within {
      border-color: var(--teal-45);
    }

    .add-plus {
      font-size: 1rem;
      color: var(--muted);
    }

    .add-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      color: var(--text);
    }

    .add-input::placeholder { color: var(--muted); }

    .add-btn {
      background: var(--teal);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 6px 16px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .add-btn:active { opacity: 0.82; }

    /* ══════════════════════════════════
       CONFIRM DELETE OVERLAY
    ══════════════════════════════════ */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.42);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
      padding: 1.25rem;
    }

    .overlay.open { display: flex; }

    .confirm-sheet {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.6rem;
      width: 100%;
      max-width: 420px;
    }

    .confirm-msg {
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.65;
      margin-bottom: 1.2rem;
    }

    .confirm-btns { display: flex; gap: 10px; }

    .btn-keep, .btn-del {
      flex: 1;
      padding: 0.7rem;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-keep {
      background: var(--surf2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-del {
      background: var(--red);
      color: #fff;
      border: none;
    }

    /* Empty state */
    .empty-state {
      font-size: 0.82rem;
      color: var(--muted);
      padding: 0.5rem 0 1rem;
    }
  </style>
</head>
<body>


<!-- ══════════════════════════════════════════
     LOCK SCREEN
══════════════════════════════════════════ -->
<div id="lock">
  <div class="lock-box">
    <span class="lock-emoji">🪁</span>
    <h1 class="lock-title">Habits</h1>
    <p class="lock-hint">Your private space</p>
    <input
      type="password"
      id="pwInput"
      class="lock-input"
      placeholder="••••••••"
      autocomplete="current-password"
    >
    <button class="lock-btn" onclick="unlock()">Enter</button>
    <p class="lock-err" id="pwErr"></p>
  </div>
</div>


<!-- ══════════════════════════════════════════
     MAIN APP
══════════════════════════════════════════ -->
<div id="app">

  <header class="app-header">
    <span class="header-brand">Shaheen · Habits</span>
    <div class="header-right">
      <button class="h-btn" id="themeBtn" onclick="toggleTheme()">☀️</button>
      <button class="h-btn lock-btn-sm" onclick="logout()">Lock</button>
    </div>
  </header>

  <main>

    <!-- Greeting -->
    <div class="greeting">
      <p class="greeting-line" id="greetLine"></p>
      <p class="greeting-date" id="greetDate"></p>
    </div>

    <!-- Today's progress -->
    <div class="prog-card">
      <div class="prog-top">
        <span class="prog-label">Today</span>
        <span class="prog-frac"><b id="doneCount">0</b> of <span id="totalCount">0</span> done</span>
      </div>
      <div class="track">
        <div class="fill" id="progressFill" style="width: 0%"></div>
      </div>
      <p class="done-msg" id="doneMsg">✦ All done for today — keep it up.</p>
    </div>

    <!-- Month navigator -->
    <div class="month-nav">
      <button class="month-nav-btn" onclick="prevMonth()">←</button>
      <span class="month-nav-label" id="monthLabel"></span>
      <button class="month-nav-btn" onclick="nextMonth()">→</button>
    </div>

    <!-- Habit cards render here -->
    <div class="habit-list" id="habitList"></div>

    <!-- Add new habit -->
    <div class="add-row">
      <span class="add-plus">＋</span>
      <input
        class="add-input"
        id="addInput"
        placeholder="Add a new habit…"
        maxlength="60"
      >
      <button class="add-btn" onclick="addHabit()">Add</button>
    </div>

  </main>
</div>


<!-- ══════════════════════════════════════════
     CONFIRM DELETE SHEET
══════════════════════════════════════════ -->
<div class="overlay" id="confirmOverlay">
  <div class="confirm-sheet">
    <p class="confirm-msg" id="confirmMsg"></p>
    <div class="confirm-btns">
      <button class="btn-keep" onclick="closeConfirm()">Keep it</button>
      <button class="btn-del" onclick="doDelete()">Delete</button>
    </div>
  </div>
</div>


<script>

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // CHANGE YOUR PASSWORD HERE
  const PASSWORD = 'E@rthH@b!t$';
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  const MONTH_NAMES = [
    'January','February','March','April','May','June',
    'July','August','September','October','November','December'
  ];


  // ──────────────────────────────────
  // HELPERS
  // ──────────────────────────────────

  // Always use local date — fixes Bangladesh timezone (UTC+6)
  function localDateStr(date) {
    const d = date || new Date();
    const y   = d.getFullYear();
    const m   = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  const TODAY = localDateStr();


  // ──────────────────────────────────
  // STATE
  // ──────────────────────────────────

  let habits        = [];
  let pendingDelete = null;

  const nowDate  = new Date();
  let viewYear   = nowDate.getFullYear();
  let viewMonth  = nowDate.getMonth(); // 0-indexed


  // ──────────────────────────────────
  // AUTH
  // ──────────────────────────────────

  // Auto-login if session is active
  if (sessionStorage.getItem('h-auth') === '1') {
    showApp();
  }

  document.getElementById('pwInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') unlock();
  });

  function unlock() {
    const entered = document.getElementById('pwInput').value;
    if (entered === PASSWORD) {
      sessionStorage.setItem('h-auth', '1');
      document.getElementById('pwErr').textContent = '';
      showApp();
    } else {
      document.getElementById('pwErr').textContent = 'Wrong password.';
      document.getElementById('pwInput').value = '';
      document.getElementById('pwInput').focus();
    }
  }

  function logout() {
    sessionStorage.removeItem('h-auth');
    document.getElementById('app').style.display  = 'none';
    document.getElementById('lock').style.display = 'flex';
    document.getElementById('pwInput').value      = '';
  }

  function showApp() {
    document.getElementById('lock').style.display = 'none';
    document.getElementById('app').style.display  = 'block';
    applyTheme();
    setGreeting();
    loadHabits();
  }


  // ──────────────────────────────────
  // THEME
  // ──────────────────────────────────

  function applyTheme() {
    const t = localStorage.getItem('h-theme') || 'light';
    document.documentElement.setAttribute('data-theme', t);
    document.getElementById('themeBtn').textContent = t === 'dark' ? '🌙' : '☀️';
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    localStorage.setItem('h-theme', current === 'dark' ? 'light' : 'dark');
    applyTheme();
  }


  // ──────────────────────────────────
  // GREETING
  // ──────────────────────────────────

  function setGreeting() {
    const hour  = new Date().getHours();
    const greet = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
    document.getElementById('greetLine').textContent = greet + ', Shaheen.';
    document.getElementById('greetDate').textContent = new Date().toLocaleDateString('en-US', {
      weekday: 'long', month: 'long', day: 'numeric'
    });
  }


  // ──────────────────────────────────
  // MONTH NAVIGATION
  // ──────────────────────────────────

  function prevMonth() {
    if (viewMonth === 0) { viewMonth = 11; viewYear--; }
    else viewMonth--;
    render();
  }

  function nextMonth() {
    if (viewMonth === 11) { viewMonth = 0; viewYear++; }
    else viewMonth++;
    render();
  }


  // ──────────────────────────────────
  // STREAK
  // ──────────────────────────────────

  function getStreak(checkins) {
    if (!checkins || checkins.length === 0) return 0;

    const set = new Set(checkins);
    let count = 0;

    // Start from today; if today not done, start from yesterday
    // (streak doesn't break just because you haven't checked yet today)
    const cursor = new Date();
    cursor.setHours(0, 0, 0, 0);
    if (!set.has(TODAY)) cursor.setDate(cursor.getDate() - 1);

    for (let i = 0; i < 730; i++) {
      const ds = localDateStr(cursor);
      if (set.has(ds)) {
        count++;
        cursor.setDate(cursor.getDate() - 1);
      } else {
        break;
      }
    }
    return count;
  }


  // ──────────────────────────────────
  // CALENDAR RENDERER
  // ──────────────────────────────────

  function renderCalendar(habit) {
    const set = new Set(habit.checkins);

    // What weekday does the 1st of this month fall on?
    const firstDayJS = new Date(viewYear, viewMonth, 1).getDay();
    // Convert Sunday-first (JS) to Monday-first offset
    // Mon=0, Tue=1, ..., Sun=6
    const startOffset = (firstDayJS === 0) ? 6 : firstDayJS - 1;

    // How many days in this month?
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

    // Today's components (local)
    const todayObj   = new Date();
    const todayYear  = todayObj.getFullYear();
    const todayMonth = todayObj.getMonth();
    const todayDate  = todayObj.getDate();

    let html = '<div class="cal-grid">';

    // Day-of-week headers (Monday first)
    ['M','T','W','T','F','S','S'].forEach(function(letter) {
      html += '<div class="cal-hdr">' + letter + '</div>';
    });

    // Empty cells before the 1st
    for (let i = 0; i < startOffset; i++) {
      html += '<div class="cal-cell empty"></div>';
    }

    // Day cells
    for (let d = 1; d <= daysInMonth; d++) {
      const ds = viewYear + '-'
        + String(viewMonth + 1).padStart(2, '0') + '-'
        + String(d).padStart(2, '0');

      const isDone   = set.has(ds);
      const isToday  = (viewYear === todayYear && viewMonth === todayMonth && d === todayDate);

      // A date is in the future if it's strictly after today
      const cellDate = new Date(viewYear, viewMonth, d);
      cellDate.setHours(0, 0, 0, 0);
      const isFuture = cellDate > todayObj;

      // Build class list
      let cls = 'cal-cell';
      if (isDone)   cls += ' done';
      if (isToday)  cls += ' today';
      if (isFuture) cls += ' future';

      // Only past + today cells are clickable
      const click = isFuture
        ? ''
        : 'onclick="toggleDate(\'' + habit.id + '\',\'' + ds + '\')"';

      // Done days show ✕, others show the day number
      const label = isDone ? '✕' : d;

      html += '<div class="' + cls + '" ' + click + '>' + label + '</div>';
    }

    html += '</div>';
    return html;
  }


  // ──────────────────────────────────
  // DATA
  // ──────────────────────────────────

  function loadHabits() {
    const raw = localStorage.getItem('shaheen-habits-v1');
    habits = raw ? JSON.parse(raw) : [];

    // Seed with Duolingo on first load
    if (habits.length === 0) {
      habits = [{ id: '1', name: 'Duolingo', checkins: [] }];
      saveHabits();
    }
    render();
  }

  function saveHabits() {
    localStorage.setItem('shaheen-habits-v1', JSON.stringify(habits));
  }


  // ──────────────────────────────────
  // ACTIONS
  // ──────────────────────────────────

  // Top circle button: toggle today
  function toggleToday(id) {
    toggleDate(id, TODAY);
  }

  // Calendar cell click: toggle any date
  function toggleDate(id, ds) {
    const habit = habits.find(function(h) { return h.id === id; });
    if (!habit) return;

    if (habit.checkins.includes(ds)) {
      habit.checkins = habit.checkins.filter(function(d) { return d !== ds; });
    } else {
      habit.checkins.push(ds);
    }

    saveHabits();
    render();
  }

  // Add a new habit
  function addHabit() {
    const input = document.getElementById('addInput');
    const name  = input.value.trim();
    if (!name) return;

    habits.push({
      id:       Date.now().toString(),
      name:     name,
      checkins: []
    });

    input.value = '';
    saveHabits();
    render();
  }

  document.getElementById('addInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') addHabit();
  });

  // Delete with confirmation
  function askDelete(id, name) {
    pendingDelete = id;
    document.getElementById('confirmMsg').textContent =
      'Delete "' + name + '"? All your streak history will be gone forever.';
    document.getElementById('confirmOverlay').classList.add('open');
  }

  function closeConfirm() {
    pendingDelete = null;
    document.getElementById('confirmOverlay').classList.remove('open');
  }

  function doDelete() {
    if (!pendingDelete) return;
    habits = habits.filter(function(h) { return h.id !== pendingDelete; });
    saveHabits();
    closeConfirm();
    render();
  }


  // ──────────────────────────────────
  // RENDER
  // ──────────────────────────────────

  function render() {

    // Update month label
    document.getElementById('monthLabel').textContent =
      MONTH_NAMES[viewMonth] + ' ' + viewYear;

    // Today's progress
    const doneToday = habits.filter(function(h) {
      return h.checkins.includes(TODAY);
    }).length;
    const total = habits.length;
    const pct   = total > 0 ? Math.round((doneToday / total) * 100) : 0;

    document.getElementById('doneCount').textContent    = doneToday;
    document.getElementById('totalCount').textContent   = total;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('doneMsg').style.display    =
      (doneToday === total && total > 0) ? 'block' : 'none';

    // Habit cards
    const listEl = document.getElementById('habitList');

    if (habits.length === 0) {
      listEl.innerHTML = '<p class="empty-state">No habits yet — add your first one below.</p>';
      return;
    }

    listEl.innerHTML = habits.map(function(h) {
      const isTodayDone = h.checkins.includes(TODAY);
      const streak      = getStreak(h.checkins);
      const unit        = streak === 1 ? 'day' : 'days';
      // Escape name for use in onclick attribute
      const safeName    = h.name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");

      return (
        '<div class="habit-card ' + (isTodayDone ? 'checked' : '') + '">' +

          /* Top row */
          '<div class="card-top">' +
            '<button' +
              ' class="check-btn ' + (isTodayDone ? 'done' : '') + '"' +
              ' onclick="toggleToday(\'' + h.id + '\')"' +
              ' aria-label="' + (isTodayDone ? 'Uncheck' : 'Check') + ' ' + h.name + ' for today"' +
            '>' + (isTodayDone ? '✓' : '') + '</button>' +

            '<span class="habit-name">' + h.name + '</span>' +

            '<div class="streak-col">' +
              '<span class="streak-num ' + (streak === 0 ? 'zero' : '') + '">' +
                (streak === 0 ? '—' : streak) +
              '</span>' +
              '<span class="streak-unit">' + unit + '</span>' +
            '</div>' +

            '<button' +
              ' class="del-btn"' +
              ' onclick="askDelete(\'' + h.id + '\', \'' + safeName + '\')"' +
              ' aria-label="Delete ' + h.name + '"' +
            '>✕</button>' +
          '</div>' +

          /* Monthly calendar */
          '<div class="cal-wrap">' + renderCalendar(h) + '</div>' +

        '</div>'
      );
    }).join('');
  }

</script>
