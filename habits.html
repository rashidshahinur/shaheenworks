<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habits — Shaheen</title>
  <meta name="robots" content="noindex, nofollow">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/sortablejs@1.15.2/Sortable.min.js"></script>
  <link rel="stylesheet" href="habits.css">
</head>

<body>

  <div id="setup">
    <div class="lock-box">
      <span class="lock-emoji">🪁</span>
      <h1 class="lock-title">Welcome</h1>
      <p class="lock-hint">Create a password. It saves to this browser — you will never need to put it in the code.</p>
      <input type="password" id="setupPw1" class="lock-input" placeholder="Choose a password">
      <input type="password" id="setupPw2" class="lock-input" placeholder="Confirm password">
      <button class="lock-btn" onclick="saveNewPassword()">Set Password</button>
      <p class="lock-err" id="setupErr"></p>
    </div>
  </div>

  <div id="lock">
    <div class="lock-box">
      <span class="lock-emoji">🪁</span>
      <h1 class="lock-title">Habits</h1>
      <p class="lock-hint">Your private space</p>
      <input type="password" id="pwInput" class="lock-input" placeholder="••••••••" autocomplete="current-password">
      <button class="lock-btn" onclick="unlock()">Enter</button>
      <p class="lock-err" id="pwErr"></p>
      <button class="lock-link" onclick="openChangePw()">Change password</button>
    </div>
  </div>

  <div id="app">
    <header class="app-header">
      <span class="header-brand">Shaheen · Habits</span>
      <div class="header-right">
        <button class="h-btn" id="themeBtn" onclick="toggleTheme()">☀️</button>
        <button class="h-btn danger" onclick="logout()">Lock</button>
      </div>
    </header>
    <main>
      <div class="greeting">
        <p class="greeting-line" id="greetLine"></p>
        <p class="greeting-date" id="greetDate"></p>
      </div>
      <div class="prog-card">
        <div class="prog-top">
          <span class="prog-label">Today</span>
          <span class="prog-frac"><b id="doneCount">0</b> of <span id="totalCount">0</span> done</span>
        </div>
        <div class="track">
          <div class="fill" id="progressFill" style="width:0%"></div>
        </div>
        <p class="done-msg" id="doneMsg">✦ All done for today — keep it up.</p>
      </div>
      <div class="month-nav">
        <button class="month-nav-btn" onclick="prevMonth()">←</button>
        <span class="month-nav-label" id="monthLabel"></span>
        <button class="month-nav-btn" onclick="nextMonth()">→</button>
      </div>
      <div class="habit-grid" id="habitGrid"></div>
      <div class="add-row">
        <span class="add-plus">＋</span>
        <input class="add-input" id="addInput" placeholder="Add a new habit…" maxlength="60">
        <button class="add-btn" onclick="addHabit()">Add</button>
      </div>
    </main>
  </div>

  <div class="overlay" id="weightOverlay">
    <div class="sheet">
      <p class="sheet-title" id="weightPopupDate"></p>
      <div class="weight-input-row">
        <input type="number" id="weightInput" class="sheet-input" placeholder="72.4" step="0.1" min="20" max="300">
        <span class="weight-kg-label">kg</span>
      </div>
      <div class="sheet-btns">
        <button class="btn-cancel" onclick="closeWeightPopup()">Cancel</button>
        <button class="btn-save" onclick="saveWeight()">Save</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="changePwOverlay">
    <div class="sheet">
      <p class="sheet-title">Change password</p>
      <input type="password" id="cpCurrent" class="sheet-input" placeholder="Current password">
      <input type="password" id="cpNew1" class="sheet-input" placeholder="New password">
      <input type="password" id="cpNew2" class="sheet-input" placeholder="Confirm new password">
      <p class="sheet-err" id="cpErr"></p>
      <div class="sheet-btns">
        <button class="btn-cancel" onclick="closeChangePw()">Cancel</button>
        <button class="btn-save" onclick="doChangePw()">Save</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="confirmOverlay">
    <div class="sheet">
      <p id="confirmMsg" style="font-size:0.9rem; line-height:1.65; margin-bottom:1.2rem; color:var(--text);"></p>
      <div class="sheet-btns">
        <button class="btn-cancel" onclick="closeConfirm()">Keep it</button>
        <button class="btn-del" onclick="doDelete()">Delete</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="weightOverlay">
    <div class="sheet">
      <p class="sheet-title" id="weightPopupDate"></p>
      <div class="weight-input-row">
        <input type="number" id="weightInput" class="sheet-input" placeholder="72.4" step="0.1" min="20" max="300">
        <span class="weight-kg-label">kg</span>
      </div>
      <div class="sheet-btns">
        <button class="btn-cancel" onclick="closeWeightPopup()">Cancel</button>
        <button class="btn-save" onclick="saveWeight()">Save</button>
      </div>
    </div>
  </div>


  <script src="habits.js"></script>
</body>

</html>
