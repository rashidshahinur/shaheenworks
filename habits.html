<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habits — Shaheen</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Sortable.js — handles drag & drop + touch reordering, no npm needed -->
  <script src="https://unpkg.com/sortablejs@1.15.2/Sortable.min.js"></script>

  <style>
    /* ══════════════════════════════════
       VARIABLES
    ══════════════════════════════════ */
    :root {
      --bg:       #f5f2eb;
      --surface:  #faf8f3;
      --surf2:    #ede9e0;
      --border:   #d8d1c6;
      --text:     #1f1b17;
      --muted:    #7a7269;
      --teal:     #0e6a67;
      --teal-08:  rgba(14, 106, 103, 0.08);
      --teal-18:  rgba(14, 106, 103, 0.18);
      --teal-45:  rgba(14, 106, 103, 0.45);
      --red:      #b53028;
    }

    [data-theme="dark"] {
      --bg:       #161412;
      --surface:  #1d1a17;
      --surf2:    #252118;
      --border:   #302c27;
      --text:     #ece7de;
      --muted:    #8c857c;
      --teal:     #69aca8;
      --teal-08:  rgba(105, 172, 168, 0.09);
      --teal-18:  rgba(105, 172, 168, 0.18);
      --teal-45:  rgba(105, 172, 168, 0.44);
      --red:      #d95f55;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ══════════════════════════════════
       LOCK & SETUP SCREENS
    ══════════════════════════════════ */
    #setup, #lock {
      min-height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .lock-box { width: 100%; max-width: 320px; text-align: center; }

    .lock-emoji { font-size: 3rem; display: block; margin-bottom: 1.4rem; }

    .lock-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 2.2rem;
      color: var(--text);
      margin-bottom: 0.25rem;
    }

    .lock-hint { font-size: 0.78rem; color: var(--muted); margin-bottom: 2rem; }

    .lock-input {
      width: 100%;
      padding: 0.85rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      text-align: center;
      letter-spacing: 0.14em;
      outline: none;
      margin-bottom: 0.65rem;
      transition: border-color 0.18s;
    }

    .lock-input:focus { border-color: var(--teal); }

    .lock-btn {
      width: 100%;
      padding: 0.85rem;
      background: var(--teal);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 0.92rem;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 0.6rem;
    }

    .lock-btn:active { opacity: 0.82; }
    .lock-err { font-size: 0.78rem; color: var(--red); min-height: 1.1em; }

    .lock-link {
      display: inline-block;
      margin-top: 1.25rem;
      font-size: 0.75rem;
      color: var(--muted);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
      background: none;
      border: none;
      font-family: 'Inter', sans-serif;
    }

    .lock-link:hover { color: var(--teal); }

    /* ══════════════════════════════════
       MODALS / OVERLAYS
    ══════════════════════════════════ */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.42);
      z-index: 300;
      align-items: flex-end;
      justify-content: center;
      padding: 1.25rem;
    }

    .overlay.open { display: flex; }

    .sheet {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.6rem;
      width: 100%;
      max-width: 420px;
    }

    .sheet-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      color: var(--text);
      margin-bottom: 1rem;
    }

    .sheet-input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      outline: none;
      margin-bottom: 0.6rem;
      transition: border-color 0.18s;
    }

    .sheet-input:focus { border-color: var(--teal); }
    .sheet-err { font-size: 0.78rem; color: var(--red); min-height: 1em; margin-bottom: 0.75rem; }

    .sheet-btns { display: flex; gap: 10px; }

    .btn-cancel, .btn-save, .btn-del {
      flex: 1;
      padding: 0.7rem;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-cancel { background: var(--surf2); color: var(--text); border: 1px solid var(--border); }
    .btn-save   { background: var(--teal); color: #fff; border: none; }
    .btn-del    { background: var(--red);  color: #fff; border: none; }

    /* ══════════════════════════════════
       APP HEADER
    ══════════════════════════════════ */
    #app { display: none; }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.5rem;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(245, 242, 235, 0.82);
      border-bottom: 1px solid var(--border);
    }

    [data-theme="dark"] .app-header { background: rgba(22, 20, 18, 0.85); }

    .header-brand {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      color: var(--text);
    }

    .header-right { display: flex; gap: 8px; align-items: center; }

    .h-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      transition: color 0.15s, border-color 0.15s;
    }

    .h-btn.danger:hover { color: var(--red); border-color: var(--red); }

    /* ══════════════════════════════════
       MAIN CONTENT
    ══════════════════════════════════ */
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 5rem;
    }

    .greeting { margin-bottom: 2rem; }

    .greeting-line { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.04em; margin-bottom: 0.2rem; }

    .greeting-date {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.9rem;
      line-height: 1.2;
      color: var(--text);
    }

    /* Progress */
    .prog-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.1rem 1.3rem;
      margin-bottom: 1.75rem;
    }

    .prog-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.65rem; }
    .prog-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
    .prog-frac { font-size: 1rem; font-weight: 500; color: var(--text); }
    .prog-frac b { color: var(--teal); font-weight: 500; }
    .track { height: 4px; background: var(--surf2); border-radius: 99px; overflow: hidden; }
    .fill { height: 100%; background: var(--teal); border-radius: 99px; transition: width 0.45s cubic-bezier(0.25, 0.8, 0.25, 1); }
    .done-msg { margin-top: 0.55rem; font-size: 0.76rem; color: var(--teal); display: none; }

    /* Month navigator */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .month-nav-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      cursor: pointer;
      color: var(--text);
      transition: border-color 0.15s, color 0.15s;
    }

    .month-nav-btn:hover { border-color: var(--teal); color: var(--teal); }

    .month-nav-label {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      min-width: 145px;
      text-align: center;
    }

    /* ══════════════════════════════════
       HABIT GRID
    ══════════════════════════════════ */
    .habit-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 1rem;
    }

    @media (max-width: 600px) {
      .habit-grid { grid-template-columns: 1fr; }
    }

    /* ══════════════════════════════════
       HABIT CARD
    ══════════════════════════════════ */
    .habit-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .habit-card.checked { border-color: var(--teal-18); }

    /* ── DRAG STATES ── */

    /* The card being dragged — lifted look */
    .habit-card.sortable-chosen {
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
      border-color: var(--teal-45) !important;
      cursor: grabbing;
    }

    /* The ghost placeholder left behind */
    .habit-card.sortable-ghost {
      opacity: 0.3;
      border-style: dashed;
    }

    /* Card top row */
    .card-top {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0.9rem 0.9rem;
      border-bottom: 1px solid var(--border);
    }

    .habit-card.checked .card-top { border-bottom-color: var(--teal-18); }

    /* ── DRAG HANDLE ── */
    .drag-handle {
      font-size: 1rem;
      color: var(--border);
      cursor: grab;
      padding: 4px 3px;
      line-height: 1;
      user-select: none;
      -webkit-user-select: none;
      flex-shrink: 0;
      transition: color 0.15s;
    }

    .drag-handle:hover { color: var(--muted); }
    .drag-handle:active { cursor: grabbing; }

    /* Check button */
    .check-btn {
      width: 38px;
      height: 38px;
      min-width: 38px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
    }

    .check-btn:hover:not(.done) { border-color: var(--teal); background: var(--teal-08); }

    .check-btn.done {
      background: var(--teal);
      border-color: var(--teal);
      color: white;
      font-size: 0.95rem;
    }

    .habit-name {
      flex: 1;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .streak-col { display: flex; flex-direction: column; align-items: center; min-width: 36px; }

    .streak-num {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 600;
      line-height: 1;
      color: var(--teal);
    }

    .streak-num.zero { color: var(--muted); font-size: 1rem; }
    .streak-unit { font-size: 0.58rem; color: var(--muted); margin-top: 2px; letter-spacing: 0.04em; }

    .del-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      opacity: 0.3;
      padding: 5px;
      font-size: 0.75rem;
      line-height: 1;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s, color 0.15s;
      flex-shrink: 0;
    }

    .del-btn:hover { opacity: 1; color: var(--red); }

    /* ══════════════════════════════════
       CALENDAR
    ══════════════════════════════════ */
    .cal-wrap { padding: 0.85rem 0.9rem 1rem; }

    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }

    .cal-hdr { font-size: 0.63rem; color: var(--muted); text-align: center; padding: 2px 0 5px; letter-spacing: 0.02em; }

    .cal-cell {
      aspect-ratio: 1;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.67rem;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, color 0.15s;
    }

    .cal-cell:not(.empty):not(.future):hover { background: var(--teal-08); color: var(--teal); }
    .cal-cell.empty  { cursor: default; }
    .cal-cell.future { color: var(--border); cursor: default; }

    .cal-cell.today {
      font-weight: 600;
      color: var(--teal);
      box-shadow: inset 0 0 0 1.5px var(--teal);
    }

    .cal-cell.done {
      background: var(--teal);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 600;
    }

    .cal-cell.done.today {
      box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--teal);
    }

    /* ══════════════════════════════════
       ADD HABIT
    ══════════════════════════════════ */
    .add-row {
      border: 1px dashed var(--border);
      border-radius: 14px;
      padding: 0.85rem 1.1rem;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: border-color 0.18s;
    }

    .add-row:focus-within { border-color: var(--teal-45); }
    .add-plus { font-size: 1rem; color: var(--muted); }

    .add-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      color: var(--text);
    }

    .add-input::placeholder { color: var(--muted); }

    .add-btn {
      background: var(--teal);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 6px 16px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .add-btn:active { opacity: 0.82; }

    .empty-state { font-size: 0.82rem; color: var(--muted); padding: 0.5rem 0 1rem; }
  </style>
</head>
<body>


<!-- ══════════════════════════════════════════
     FIRST-TIME SETUP
══════════════════════════════════════════ -->
<div id="setup">
  <div class="lock-box">
    <span class="lock-emoji">🪁</span>
    <h1 class="lock-title">Welcome</h1>
    <p class="lock-hint">Create a password. It saves to this browser — you will never need to put it in the code.</p>
    <input type="password" id="setupPw1" class="lock-input" placeholder="Choose a password">
    <input type="password" id="setupPw2" class="lock-input" placeholder="Confirm password">
    <button class="lock-btn" onclick="saveNewPassword()">Set Password</button>
    <p class="lock-err" id="setupErr"></p>
  </div>
</div>


<!-- ══════════════════════════════════════════
     LOCK SCREEN
══════════════════════════════════════════ -->
<div id="lock">
  <div class="lock-box">
    <span class="lock-emoji">🪁</span>
    <h1 class="lock-title">Habits</h1>
    <p class="lock-hint">Your private space</p>
    <input type="password" id="pwInput" class="lock-input" placeholder="••••••••" autocomplete="current-password">
    <button class="lock-btn" onclick="unlock()">Enter</button>
    <p class="lock-err" id="pwErr"></p>
    <button class="lock-link" onclick="openChangePw()">Change password</button>
  </div>
</div>


<!-- ══════════════════════════════════════════
     MAIN APP
══════════════════════════════════════════ -->
<div id="app">

  <header class="app-header">
    <span class="header-brand">Shaheen · Habits</span>
    <div class="header-right">
      <button class="h-btn" id="themeBtn" onclick="toggleTheme()">☀️</button>
      <button class="h-btn danger" onclick="logout()">Lock</button>
    </div>
  </header>

  <main>

    <div class="greeting">
      <p class="greeting-line" id="greetLine"></p>
      <p class="greeting-date"  id="greetDate"></p>
    </div>

    <div class="prog-card">
      <div class="prog-top">
        <span class="prog-label">Today</span>
        <span class="prog-frac"><b id="doneCount">0</b> of <span id="totalCount">0</span> done</span>
      </div>
      <div class="track"><div class="fill" id="progressFill" style="width:0%"></div></div>
      <p class="done-msg" id="doneMsg">✦ All done for today — keep it up.</p>
    </div>

    <div class="month-nav">
      <button class="month-nav-btn" onclick="prevMonth()">←</button>
      <span class="month-nav-label" id="monthLabel"></span>
      <button class="month-nav-btn" onclick="nextMonth()">→</button>
    </div>

    <!-- Habit cards render here -->
    <div class="habit-grid" id="habitGrid"></div>

    <div class="add-row">
      <span class="add-plus">＋</span>
      <input class="add-input" id="addInput" placeholder="Add a new habit…" maxlength="60">
      <button class="add-btn" onclick="addHabit()">Add</button>
    </div>

  </main>
</div>


<!-- ══════════════════════════════════════════
     CHANGE PASSWORD SHEET
══════════════════════════════════════════ -->
<div class="overlay" id="changePwOverlay">
  <div class="sheet">
    <p class="sheet-title">Change password</p>
    <input type="password" id="cpCurrent" class="sheet-input" placeholder="Current password">
    <input type="password" id="cpNew1"    class="sheet-input" placeholder="New password">
    <input type="password" id="cpNew2"    class="sheet-input" placeholder="Confirm new password">
    <p class="sheet-err" id="cpErr"></p>
    <div class="sheet-btns">
      <button class="btn-cancel" onclick="closeChangePw()">Cancel</button>
      <button class="btn-save"   onclick="doChangePw()">Save</button>
    </div>
  </div>
</div>


<!-- ══════════════════════════════════════════
     CONFIRM DELETE SHEET
══════════════════════════════════════════ -->
<div class="overlay" id="confirmOverlay">
  <div class="sheet">
    <p id="confirmMsg" style="font-size:0.9rem; line-height:1.65; margin-bottom:1.2rem; color:var(--text);"></p>
    <div class="sheet-btns">
      <button class="btn-cancel" onclick="closeConfirm()">Keep it</button>
      <button class="btn-del"    onclick="doDelete()">Delete</button>
    </div>
  </div>
</div>


<script>

  /* ══════════════════════════════════
     CONSTANTS
  ══════════════════════════════════ */
  const STORAGE_PW     = 'h-password';
  const STORAGE_HABITS = 'shaheen-habits-v1';
  const STORAGE_THEME  = 'h-theme';
  const SESSION_AUTH   = 'h-auth';

  const MONTH_NAMES = [
    'January','February','March','April','May','June',
    'July','August','September','October','November','December'
  ];


  /* ══════════════════════════════════
     HELPERS
  ══════════════════════════════════ */

  // Local date string — avoids UTC timezone issues (important for Bangladesh UTC+6)
  function localDateStr(date) {
    const d = date || new Date();
    return d.getFullYear()
      + '-' + String(d.getMonth() + 1).padStart(2, '0')
      + '-' + String(d.getDate()).padStart(2, '0');
  }

  const TODAY = localDateStr();


  /* ══════════════════════════════════
     AUTO EMOJI  (extend this list as you add habits)
  ══════════════════════════════════ */
  function getEmoji(name) {
    const n = name.toLowerCase();
    if (n.includes('duolingo') || n.includes('language'))                          return '🦉';
    if (n.includes('dumble') || n.includes('dumbbell'))                            return '🏋️';
    if (n.includes('gym') || n.includes('workout') || n.includes('exercise') || n.includes('pushup')) return '💪';
    if (n.includes('run') || n.includes('jog'))                                    return '🏃';
    if (n.includes('walk'))                                                        return '🚶';
    if (n.includes('swim'))                                                        return '🏊';
    if (n.includes('yoga') || n.includes('stretch') || n.includes('medit'))       return '🧘';
    if (n.includes('read') || n.includes('book'))                                  return '📚';
    if (n.includes('write') || n.includes('journal') || n.includes('diary'))      return '✍️';
    if (n.includes('water') || n.includes('drink'))                               return '💧';
    if (n.includes('sleep') || n.includes('bed'))                                 return '😴';
    if (n.includes('pray') || n.includes('namaz') || n.includes('salah'))         return '🤲';
    if (n.includes('morning'))                                                     return '🌅';
    if (n.includes('night') || n.includes('evening'))                             return '🌙';
    if (n.includes('code') || n.includes('program') || n.includes('coding'))      return '💻';
    if (n.includes('music') || n.includes('guitar') || n.includes('piano') || n.includes('sing')) return '🎵';
    if (n.includes('cook') || n.includes('food'))                                 return '🍳';
    if (n.includes('vitamin') || n.includes('medicine') || n.includes('pill'))    return '💊';
    if (n.includes('fast') || n.includes('fasting'))                              return '⏱️';
    if (n.includes('diet') || n.includes('sugar') || n.includes('healthy'))       return '🥗';
    if (n.includes('study') || n.includes('learn'))                               return '📖';
    if (n.includes('gratitude') || n.includes('thank'))                           return '🙏';
    if (n.includes('cold') || n.includes('shower'))                               return '🚿';
    if (n.includes('breath'))                                                      return '🫁';
    if (n.includes('draw') || n.includes('sketch') || n.includes('paint'))        return '🎨';
    if (n.includes('photo'))                                                       return '📷';
    if (n.includes('no phone') || n.includes('screen'))                           return '📵';
    return '✨';
  }


  /* ══════════════════════════════════
     STATE
  ══════════════════════════════════ */
  let habits        = [];
  let pendingDelete = null;
  let sortableInstance = null;

  const nowDate = new Date();
  let viewYear  = nowDate.getFullYear();
  let viewMonth = nowDate.getMonth();


  /* ══════════════════════════════════
     AUTH  — password lives in localStorage, never in code
  ══════════════════════════════════ */
  function initAuth() {
    const saved = localStorage.getItem(STORAGE_PW);
    if (!saved) {
      document.getElementById('setup').style.display = 'flex';
    } else if (sessionStorage.getItem(SESSION_AUTH) === '1') {
      showApp();
    } else {
      document.getElementById('lock').style.display = 'flex';
    }
  }

  function saveNewPassword() {
    const pw1 = document.getElementById('setupPw1').value;
    const pw2 = document.getElementById('setupPw2').value;
    const err = document.getElementById('setupErr');
    if (!pw1)          { err.textContent = 'Please enter a password.'; return; }
    if (pw1 !== pw2)   { err.textContent = 'Passwords do not match.'; return; }
    if (pw1.length < 4){ err.textContent = 'At least 4 characters please.'; return; }
    localStorage.setItem(STORAGE_PW, pw1);
    sessionStorage.setItem(SESSION_AUTH, '1');
    document.getElementById('setup').style.display = 'none';
    err.textContent = '';
    showApp();
  }

  function unlock() {
    const entered = document.getElementById('pwInput').value;
    const saved   = localStorage.getItem(STORAGE_PW);
    const err     = document.getElementById('pwErr');
    if (entered === saved) {
      sessionStorage.setItem(SESSION_AUTH, '1');
      err.textContent = '';
      document.getElementById('lock').style.display = 'none';
      showApp();
    } else {
      err.textContent = 'Wrong password.';
      document.getElementById('pwInput').value = '';
      document.getElementById('pwInput').focus();
    }
  }

  function logout() {
    sessionStorage.removeItem(SESSION_AUTH);
    document.getElementById('app').style.display  = 'none';
    document.getElementById('lock').style.display = 'flex';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwErr').textContent = '';
  }

  function showApp() {
    document.getElementById('lock').style.display = 'none';
    document.getElementById('app').style.display  = 'block';
    applyTheme();
    setGreeting();
    loadHabits();
  }

  document.getElementById('setupPw2').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') saveNewPassword();
  });

  document.getElementById('pwInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') unlock();
  });


  /* ══════════════════════════════════
     CHANGE PASSWORD
  ══════════════════════════════════ */
  function openChangePw() {
    document.getElementById('cpCurrent').value = '';
    document.getElementById('cpNew1').value    = '';
    document.getElementById('cpNew2').value    = '';
    document.getElementById('cpErr').textContent = '';
    document.getElementById('changePwOverlay').classList.add('open');
  }

  function closeChangePw() {
    document.getElementById('changePwOverlay').classList.remove('open');
  }

  function doChangePw() {
    const current = document.getElementById('cpCurrent').value;
    const new1    = document.getElementById('cpNew1').value;
    const new2    = document.getElementById('cpNew2').value;
    const err     = document.getElementById('cpErr');
    const saved   = localStorage.getItem(STORAGE_PW);
    if (current !== saved)    { err.textContent = 'Current password is wrong.'; return; }
    if (!new1)                { err.textContent = 'Enter a new password.'; return; }
    if (new1 !== new2)        { err.textContent = 'New passwords do not match.'; return; }
    if (new1.length < 4)      { err.textContent = 'At least 4 characters please.'; return; }
    localStorage.setItem(STORAGE_PW, new1);
    err.textContent = '';
    closeChangePw();
  }


  /* ══════════════════════════════════
     THEME
  ══════════════════════════════════ */
  function applyTheme() {
    const t = localStorage.getItem(STORAGE_THEME) || 'light';
    document.documentElement.setAttribute('data-theme', t);
    document.getElementById('themeBtn').textContent = t === 'dark' ? '🌙' : '☀️';
  }

  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme');
    localStorage.setItem(STORAGE_THEME, cur === 'dark' ? 'light' : 'dark');
    applyTheme();
  }


  /* ══════════════════════════════════
     GREETING
  ══════════════════════════════════ */
  function setGreeting() {
    const hour  = new Date().getHours();
    const greet = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
    document.getElementById('greetLine').textContent = greet + ', Shaheen.';
    document.getElementById('greetDate').textContent = new Date().toLocaleDateString('en-US', {
      weekday: 'long', month: 'long', day: 'numeric'
    });
  }


  /* ══════════════════════════════════
     MONTH NAVIGATION
  ══════════════════════════════════ */
  function prevMonth() {
    if (viewMonth === 0) { viewMonth = 11; viewYear--; } else viewMonth--;
    render();
  }

  function nextMonth() {
    if (viewMonth === 11) { viewMonth = 0; viewYear++; } else viewMonth++;
    render();
  }


  /* ══════════════════════════════════
     STREAK
  ══════════════════════════════════ */
  function getStreak(checkins) {
    if (!checkins || checkins.length === 0) return 0;
    const set    = new Set(checkins);
    let   count  = 0;
    const cursor = new Date();
    cursor.setHours(0, 0, 0, 0);
    if (!set.has(TODAY)) cursor.setDate(cursor.getDate() - 1);
    for (let i = 0; i < 730; i++) {
      const ds = localDateStr(cursor);
      if (set.has(ds)) { count++; cursor.setDate(cursor.getDate() - 1); }
      else break;
    }
    return count;
  }


  /* ══════════════════════════════════
     CALENDAR RENDERER
  ══════════════════════════════════ */
  function renderCalendar(habit) {
    const set         = new Set(habit.checkins);
    const firstDayJS  = new Date(viewYear, viewMonth, 1).getDay();
    const startOffset = firstDayJS === 0 ? 6 : firstDayJS - 1;
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

    const todayObj   = new Date();
    const todayYear  = todayObj.getFullYear();
    const todayMonth = todayObj.getMonth();
    const todayDate  = todayObj.getDate();

    let html = '<div class="cal-grid">';

    ['M','T','W','T','F','S','S'].forEach(function(l) {
      html += '<div class="cal-hdr">' + l + '</div>';
    });

    for (let i = 0; i < startOffset; i++) {
      html += '<div class="cal-cell empty"></div>';
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const ds = viewYear
        + '-' + String(viewMonth + 1).padStart(2, '0')
        + '-' + String(d).padStart(2, '0');

      const isDone  = set.has(ds);
      const isToday = (viewYear === todayYear && viewMonth === todayMonth && d === todayDate);

      const cellDate = new Date(viewYear, viewMonth, d);
      cellDate.setHours(0, 0, 0, 0);
      const isFuture = cellDate > todayObj;

      let cls = 'cal-cell';
      if (isDone)   cls += ' done';
      if (isToday)  cls += ' today';
      if (isFuture) cls += ' future';

      const click = isFuture ? '' : 'onclick="toggleDate(\'' + habit.id + '\',\'' + ds + '\')"';
      const label = isDone ? '✕' : d;

      html += '<div class="' + cls + '" ' + click + '>' + label + '</div>';
    }

    html += '</div>';
    return html;
  }


  /* ══════════════════════════════════
     DRAG TO REORDER  (Sortable.js)
  ══════════════════════════════════ */
  function initSortable() {
    // Destroy old instance if it exists (render() replaces innerHTML)
    if (sortableInstance) {
      sortableInstance.destroy();
      sortableInstance = null;
    }

    const grid = document.getElementById('habitGrid');

    sortableInstance = Sortable.create(grid, {
      // Only drag from the handle icon — calendar clicks still work
      handle: '.drag-handle',

      // Smooth animation when cards snap into place
      animation: 200,

      // CSS classes added by Sortable during drag
      ghostClass:  'sortable-ghost',   // the empty placeholder left behind
      chosenClass: 'sortable-chosen',  // the card being dragged

      // Works on mobile touch too
      forceFallback: false,

      // After drop: update habits array order and save
      onEnd: function(evt) {
        if (evt.oldIndex === evt.newIndex) return; // no change

        // Move the habit in the array to match the new visual order
        const moved = habits.splice(evt.oldIndex, 1)[0];
        habits.splice(evt.newIndex, 0, moved);
        saveHabits();

        // No need to call render() — Sortable already moved the DOM
      }
    });
  }


  /* ══════════════════════════════════
     DATA
  ══════════════════════════════════ */
  function loadHabits() {
    const raw = localStorage.getItem(STORAGE_HABITS);
    habits = raw ? JSON.parse(raw) : [];
    if (habits.length === 0) {
      habits = [{ id: '1', name: 'Duolingo', checkins: [] }];
      saveHabits();
    }
    render();
  }

  function saveHabits() {
    localStorage.setItem(STORAGE_HABITS, JSON.stringify(habits));
  }


  /* ══════════════════════════════════
     ACTIONS
  ══════════════════════════════════ */
  function toggleToday(id) { toggleDate(id, TODAY); }

  function toggleDate(id, ds) {
    const habit = habits.find(function(h) { return h.id === id; });
    if (!habit) return;
    if (habit.checkins.includes(ds)) {
      habit.checkins = habit.checkins.filter(function(d) { return d !== ds; });
    } else {
      habit.checkins.push(ds);
    }
    saveHabits();
    render();
  }

  function addHabit() {
    const input = document.getElementById('addInput');
    const name  = input.value.trim();
    if (!name) return;
    habits.push({ id: Date.now().toString(), name: name, checkins: [] });
    input.value = '';
    saveHabits();
    render();
  }

  document.getElementById('addInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') addHabit();
  });

  function askDelete(id, name) {
    pendingDelete = id;
    document.getElementById('confirmMsg').textContent =
      'Delete "' + name + '"? All your streak history will be gone forever.';
    document.getElementById('confirmOverlay').classList.add('open');
  }

  function closeConfirm() {
    pendingDelete = null;
    document.getElementById('confirmOverlay').classList.remove('open');
  }

  function doDelete() {
    if (!pendingDelete) return;
    habits = habits.filter(function(h) { return h.id !== pendingDelete; });
    saveHabits();
    closeConfirm();
    render();
  }


  /* ══════════════════════════════════
     RENDER
  ══════════════════════════════════ */
  function render() {
    document.getElementById('monthLabel').textContent =
      MONTH_NAMES[viewMonth] + ' ' + viewYear;

    const doneToday = habits.filter(function(h) { return h.checkins.includes(TODAY); }).length;
    const total     = habits.length;
    const pct       = total > 0 ? Math.round((doneToday / total) * 100) : 0;

    document.getElementById('doneCount').textContent    = doneToday;
    document.getElementById('totalCount').textContent   = total;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('doneMsg').style.display    =
      (doneToday === total && total > 0) ? 'block' : 'none';

    const grid = document.getElementById('habitGrid');

    if (habits.length === 0) {
      grid.innerHTML = '<p class="empty-state">No habits yet — add your first one below.</p>';
      return;
    }

    grid.innerHTML = habits.map(function(h) {
      const isTodayDone = h.checkins.includes(TODAY);
      const streak      = getStreak(h.checkins);
      const unit        = streak === 1 ? 'day' : 'days';
      const emoji       = getEmoji(h.name);
      const safeName    = h.name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");

      return (
        '<div class="habit-card ' + (isTodayDone ? 'checked' : '') + '" data-id="' + h.id + '">' +

          '<div class="card-top">' +

            // ⠿ drag handle — grab this to reorder
            '<span class="drag-handle" title="Drag to reorder">⠿</span>' +

            // Circle: shows emoji when not done, ✓ when done today
            '<button' +
            ' class="check-btn ' + (isTodayDone ? 'done' : '') + '"' +
            ' onclick="toggleToday(\'' + h.id + '\')"' +
            ' aria-label="' + (isTodayDone ? 'Uncheck' : 'Check') + ' ' + h.name + '"' +
            '>' + (isTodayDone ? '✓' : emoji) + '</button>' +

            '<span class="habit-name">' + h.name + '</span>' +

            '<div class="streak-col">' +
              '<span class="streak-num ' + (streak === 0 ? 'zero' : '') + '">' + (streak === 0 ? '—' : streak) + '</span>' +
              '<span class="streak-unit">' + unit + '</span>' +
            '</div>' +

            '<button class="del-btn" onclick="askDelete(\'' + h.id + '\', \'' + safeName + '\')" aria-label="Delete">✕</button>' +

          '</div>' +

          '<div class="cal-wrap">' + renderCalendar(h) + '</div>' +

        '</div>'
      );
    }).join('');

    // Re-init Sortable after every render (innerHTML replacement resets the DOM)
    initSortable();
  }


  /* ══════════════════════════════════
     START
  ══════════════════════════════════ */
  initAuth();

</script>
</body>
</html>
