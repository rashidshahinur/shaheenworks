<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habits — Shaheen</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #f5f2eb;
      --surface: #faf8f3;
      --surf2:   #ede9e1;
      --border:  #d8d1c6;
      --text:    #1f1b17;
      --muted:   #7a7269;
      --teal:    #0e6a67;
      --t10:     rgba(14,106,103,0.08);
      --t25:     rgba(14,106,103,0.22);
      --t50:     rgba(14,106,103,0.48);
      --red:     #b83228;
    }
    [data-theme="dark"] {
      --bg:      #161412;
      --surface: #1d1a17;
      --surf2:   #252118;
      --border:  #302c27;
      --text:    #ece7de;
      --muted:   #8c857c;
      --teal:    #69aca8;
      --t10:     rgba(105,172,168,0.09);
      --t25:     rgba(105,172,168,0.22);
      --t50:     rgba(105,172,168,0.46);
      --red:     #d95f55;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* LOCK */
    #lock { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .lbox { width: 100%; max-width: 310px; text-align: center; }
    .lkite { font-size: 3rem; display: block; margin-bottom: 1.4rem; }
    .ltitle { font-family: 'Playfair Display', serif; font-style: italic; font-size: 2.2rem; color: var(--text); margin-bottom: 0.25rem; }
    .lhint { font-size: 0.78rem; color: var(--muted); margin-bottom: 2.25rem; }
    .linput {
      width: 100%; padding: 0.85rem 1rem; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 1rem;
      text-align: center; letter-spacing: 0.14em; outline: none; margin-bottom: 0.7rem; transition: border-color 0.18s;
    }
    .linput:focus { border-color: var(--teal); }
    .lbtn {
      width: 100%; padding: 0.85rem; background: var(--teal); color: #fff; border: none;
      border-radius: 12px; font-family: 'Inter', sans-serif; font-size: 0.92rem; font-weight: 500; cursor: pointer;
    }
    .lbtn:active { opacity: 0.82; }
    .lerr { margin-top: 0.6rem; font-size: 0.78rem; color: var(--red); min-height: 1.1em; }

    /* APP */
    #app { display: none; }
    .aheader {
      position: sticky; top: 0; z-index: 40; display: flex; align-items: center; justify-content: space-between;
      padding: 0.85rem 1.5rem; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      background: rgba(245,242,235,0.8); border-bottom: 1px solid var(--border);
    }
    [data-theme="dark"] .aheader { background: rgba(22,20,18,0.84); }
    .abrand { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--text); }
    .ahright { display: flex; gap: 8px; }
    .hbtn {
      background: none; border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px;
      font-size: 0.85rem; cursor: pointer; color: var(--text); font-family: 'Inter', sans-serif;
      transition: color 0.15s, border-color 0.15s;
    }
    .hbtn.lk:hover { color: var(--red); border-color: var(--red); }

    main { max-width: 520px; margin: 0 auto; padding: 2.5rem 1.25rem 5rem; }

    /* GREETING */
    .greet { margin-bottom: 2.25rem; }
    .gline { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.04em; margin-bottom: 0.2rem; }
    .gdate { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.9rem; line-height: 1.2; color: var(--text); }

    /* PROGRESS */
    .prog-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 1.15rem 1.3rem; margin-bottom: 1.5rem;
    }
    .prog-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.65rem; }
    .prog-lbl { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
    .prog-frac { font-size: 1rem; font-weight: 500; color: var(--text); }
    .prog-frac b { color: var(--teal); font-weight: 500; }
    .track { height: 4px; background: var(--surf2); border-radius: 99px; overflow: hidden; }
    .fill { height: 100%; background: var(--teal); border-radius: 99px; transition: width 0.45s cubic-bezier(.25,.8,.25,1); }
    .dmsg { margin-top: 0.55rem; font-size: 0.76rem; color: var(--teal); display: none; }

    /* HABIT CARDS */
    .hlist { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1rem; }
    .hcard {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 1.05rem 1.1rem; display: flex; align-items: center; gap: 13px;
      transition: border-color 0.25s, background 0.25s;
    }
    .hcard.ck { background: var(--t10); border-color: var(--t25); }

    .cbtn {
      width: 44px; height: 44px; min-width: 44px; border-radius: 50%; border: 1.5px solid var(--border);
      background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 1.05rem; color: transparent; transition: all 0.2s; -webkit-tap-highlight-color: transparent;
    }
    .cbtn:hover:not(.done) { border-color: var(--t50); background: var(--t10); }
    .cbtn.done { background: var(--teal); border-color: var(--teal); color: #fff; }

    .hmid { flex: 1; min-width: 0; }
    .hname { font-size: 0.92rem; font-weight: 500; color: var(--text); margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* 7-day dots */
    .week { display: flex; gap: 6px; }
    .dcol { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .dltr { font-size: 9px; color: var(--muted); line-height: 1; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--surf2); border: 1px solid var(--border); transition: background 0.2s, border-color 0.2s; }
    .dot.hit { background: var(--teal); border-color: var(--teal); }
    .dot.now { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--teal); }

    /* Streak */
    .scol { display: flex; flex-direction: column; align-items: center; min-width: 46px; }
    .snum { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 600; line-height: 1; color: var(--teal); }
    .snum.z { color: var(--muted); font-size: 1.5rem; }
    .sunit { font-size: 0.64rem; color: var(--muted); margin-top: 1px; letter-spacing: 0.04em; }

    .dbtn {
      background: none; border: none; cursor: pointer; color: var(--muted); opacity: 0.3;
      padding: 6px; font-size: 0.78rem; line-height: 1; -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s, color 0.15s;
    }
    .dbtn:hover { opacity: 1; color: var(--red); }

    /* ADD */
    .addrow {
      border: 1px dashed var(--border); border-radius: 14px; padding: 0.85rem 1.1rem;
      display: flex; align-items: center; gap: 10px; transition: border-color 0.18s;
    }
    .addrow:focus-within { border-color: var(--t50); }
    .aplus { font-size: 1rem; color: var(--muted); }
    .ainput { flex: 1; background: transparent; border: none; outline: none; font-family: 'Inter', sans-serif; font-size: 0.88rem; color: var(--text); }
    .ainput::placeholder { color: var(--muted); }
    .asbtn {
      background: var(--teal); color: #fff; border: none; border-radius: 8px; padding: 6px 15px;
      font-size: 0.8rem; font-weight: 500; cursor: pointer; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent;
    }
    .asbtn:active { opacity: 0.82; }

    /* CONFIRM */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.42); z-index: 200; align-items: flex-end; justify-content: center; padding: 1.25rem; }
    .overlay.open { display: flex; }
    .sheet { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 1.6rem; width: 100%; max-width: 400px; }
    .smsg { font-size: 0.9rem; color: var(--text); line-height: 1.65; margin-bottom: 1.2rem; }
    .sbtns { display: flex; gap: 10px; }
    .sk, .sd { flex: 1; padding: 0.7rem; border-radius: 10px; font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 500; cursor: pointer; }
    .sk { background: var(--surf2); color: var(--text); border: 1px solid var(--border); }
    .sd { background: var(--red); color: #fff; border: none; }

    .empty { font-size: 0.82rem; color: var(--muted); padding: 0.5rem 0 1rem; }
  </style>
</head>
<body>

<div id="lock">
  <div class="lbox">
    <span class="lkite">🪁</span>
    <h1 class="ltitle">Habits</h1>
    <p class="lhint">Your private space</p>
    <input type="password" id="pwInput" class="linput" placeholder="••••••••" autocomplete="current-password">
    <button class="lbtn" onclick="unlock()">Enter</button>
    <p class="lerr" id="pwErr"></p>
  </div>
</div>

<div id="app">
  <header class="aheader">
    <span class="abrand">Shaheen · Habits</span>
    <div class="ahright">
      <button class="hbtn" id="themeBtn" onclick="toggleTheme()">☀️</button>
      <button class="hbtn lk" onclick="logout()">Lock</button>
    </div>
  </header>
  <main>
    <div class="greet">
      <p class="gline" id="gline"></p>
      <p class="gdate" id="gdate"></p>
    </div>
    <div class="prog-card">
      <div class="prog-top">
        <span class="prog-lbl">Today</span>
        <span class="prog-frac"><b id="dn">0</b> of <span id="tn">0</span> done</span>
      </div>
      <div class="track"><div class="fill" id="fill" style="width:0%"></div></div>
      <p class="dmsg" id="dmsg">✦ All done for today — keep it up.</p>
    </div>
    <div class="hlist" id="hlist"></div>
    <div class="addrow">
      <span class="aplus">＋</span>
      <input class="ainput" id="addInput" placeholder="Add a new habit…" maxlength="60">
      <button class="asbtn" onclick="addHabit()">Add</button>
    </div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <p class="smsg" id="smsg"></p>
    <div class="sbtns">
      <button class="sk" onclick="closeSheet()">Keep it</button>
      <button class="sd" onclick="doDelete()">Delete</button>
    </div>
  </div>
</div>

<script>
  // ─── SET YOUR PASSWORD HERE ──────────────────────
  const PW = 'E@rthH@b!t$';
  // ────────────────────────────────────────────────

  function localDs(d) {
    d = d || new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  const TODAY = localDs();
  let habits = [], pendingDel = null;

  // AUTH
  if (sessionStorage.getItem('h-ok') === '1') showApp();
  document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

  function unlock() {
    if (document.getElementById('pwInput').value === PW) {
      sessionStorage.setItem('h-ok', '1');
      document.getElementById('pwErr').textContent = '';
      showApp();
    } else {
      document.getElementById('pwErr').textContent = 'Wrong password.';
      document.getElementById('pwInput').value = '';
      document.getElementById('pwInput').focus();
    }
  }

  function logout() {
    sessionStorage.removeItem('h-ok');
    document.getElementById('app').style.display = 'none';
    document.getElementById('lock').style.display = 'flex';
    document.getElementById('pwInput').value = '';
  }

  function showApp() {
    document.getElementById('lock').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    applyTheme(); setGreeting(); loadHabits();
  }

  // THEME
  function applyTheme() {
    const t = localStorage.getItem('h-theme') || 'light';
    document.documentElement.setAttribute('data-theme', t);
    document.getElementById('themeBtn').textContent = t === 'dark' ? '🌙' : '☀️';
  }
  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme');
    localStorage.setItem('h-theme', cur === 'dark' ? 'light' : 'dark');
    applyTheme();
  }

  // GREETING
  function setGreeting() {
    const h = new Date().getHours();
    document.getElementById('gline').textContent =
      (h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening') + ', Shaheen.';
    document.getElementById('gdate').textContent =
      new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  }

  // WEEK DOTS
  function last7() {
    const ltrs = ['S','M','T','W','T','F','S'], out = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      out.push({ ds: localDs(d), l: ltrs[d.getDay()], today: i === 0 });
    }
    return out;
  }

  function dotsHtml(checkins) {
    const s = new Set(checkins);
    return last7().map(({ ds, l, today }) =>
      `<div class="dcol"><span class="dltr">${l}</span><div class="dot${s.has(ds)?' hit':''}${today?' now':''}"></div></div>`
    ).join('');
  }

  // STREAK
  function getStreak(checkins) {
    if (!checkins || !checkins.length) return 0;
    const s = new Set(checkins);
    let n = 0;
    const d = new Date(); d.setHours(0,0,0,0);
    if (!s.has(TODAY)) d.setDate(d.getDate() - 1);
    for (let i = 0; i < 730; i++) {
      if (s.has(localDs(d))) { n++; d.setDate(d.getDate() - 1); } else break;
    }
    return n;
  }

  // DATA
  function loadHabits() {
    const raw = localStorage.getItem('shaheen-habits-v1');
    habits = raw ? JSON.parse(raw) : [];
    if (!habits.length) { habits = [{ id: '1', name: 'Duolingo', checkins: [] }]; save(); }
    render();
  }

  function save() { localStorage.setItem('shaheen-habits-v1', JSON.stringify(habits)); }

  // ACTIONS
  function toggle(id) {
    const h = habits.find(x => x.id === id); if (!h) return;
    h.checkins = h.checkins.includes(TODAY) ? h.checkins.filter(d => d !== TODAY) : [...h.checkins, TODAY];
    save(); render();
  }

  function addHabit() {
    const inp = document.getElementById('addInput');
    const name = inp.value.trim(); if (!name) return;
    habits.push({ id: Date.now().toString(), name, checkins: [] });
    inp.value = ''; save(); render();
  }

  document.getElementById('addInput').addEventListener('keydown', e => { if (e.key === 'Enter') addHabit(); });

  function askDelete(id, name) {
    pendingDel = id;
    document.getElementById('smsg').textContent = `Delete "${name}"? Your streak history will be gone forever.`;
    document.getElementById('overlay').classList.add('open');
  }

  function closeSheet() { pendingDel = null; document.getElementById('overlay').classList.remove('open'); }

  function doDelete() {
    if (!pendingDel) return;
    habits = habits.filter(h => h.id !== pendingDel);
    save(); closeSheet(); render();
  }

  // RENDER
  function render() {
    const done = habits.filter(h => h.checkins.includes(TODAY)).length;
    const total = habits.length;
    document.getElementById('dn').textContent = done;
    document.getElementById('tn').textContent = total;
    document.getElementById('fill').style.width = (total ? Math.round(done/total*100) : 0) + '%';
    document.getElementById('dmsg').style.display = (done === total && total > 0) ? 'block' : 'none';

    const list = document.getElementById('hlist');
    if (!habits.length) { list.innerHTML = '<p class="empty">No habits yet — add your first one below.</p>'; return; }

    list.innerHTML = habits.map(h => {
      const ok = h.checkins.includes(TODAY);
      const s = getStreak(h.checkins);
      const sn = h.name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
      return `<div class="hcard${ok?' ck':''}">
        <button class="cbtn${ok?' done':''}" onclick="toggle('${h.id}')" aria-label="${ok?'Uncheck':'Check'} ${h.name}">${ok?'✓':''}</button>
        <div class="hmid">
          <div class="hname">${h.name}</div>
          <div class="week">${dotsHtml(h.checkins)}</div>
        </div>
        <div class="scol">
          <span class="snum${s===0?' z':''}">${s===0?'—':s}</span>
          <span class="sunit">${s===1?'day':'days'}</span>
        </div>
        <button class="dbtn" onclick="askDelete('${h.id}','${sn}')" aria-label="Delete ${h.name}">✕</button>
      </div>`;
    }).join('');
  }
</script>
</body>
</html>
